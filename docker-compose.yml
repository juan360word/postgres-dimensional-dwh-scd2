
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: tienda_online
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/tienda_online.sql:/docker-entrypoint-initdb.d/01_tienda_online.sql:ro

volumes:
  pgdata:
